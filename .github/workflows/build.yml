name: Build Windows exe

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # нужно только для публикации релиза по тегу v*

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean packaging/DriverUpdater.spec

      - name: "Smoke test: GUI starts"
        run: |
          $p = Start-Process dist\DriverUpdater.exe -ArgumentList '--selftest' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "GUI exited with $($p.ExitCode)" }

      - name: "Smoke test: real hardware scan on Windows"
        run: |
          dist\DriverUpdater-cli.exe scan --all --save scan.json
          if ($LASTEXITCODE -ne 0) { throw "scan failed" }

      - name: "Smoke test: Microsoft Update Catalog live search"
        continue-on-error: true
        run: |
          python -c "from driverupdater.providers import catalog; r = catalog.search_hwid('PCI\\VEN_8086&DEV_2723'); print(len(r), 'results'); [print(' ', o.title, '|', o.products, '|', o.version, '|', o.date) for o in r[:5]]; assert r, 'no results'; u = catalog.download_urls(r[0].update_id); print(u); assert u, 'no download url'"

      - name: "Smoke test: Windows Update driver search"
        continue-on-error: true
        timeout-minutes: 15
        run: dist\DriverUpdater-cli.exe check --no-catalog --json > check.json; Get-Content check.json -TotalCount 40

      - uses: actions/upload-artifact@v5
        with:
          name: DriverUpdater-windows
          path: |
            dist/DriverUpdater.exe
            dist/DriverUpdater-cli.exe
            scan.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DriverUpdater.exe
            dist/DriverUpdater-cli.exe
