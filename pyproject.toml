[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driverupdater"
version = "0.1.0"
description = "Определение железа ПК, поиск и установка драйверов из официальных источников Microsoft"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]

[project.scripts]
driverupdater = "driverupdater.cli:main"

[project.gui-scripts]
driverupdater-gui = "driverupdater.gui.app:main"

[tool.setuptools.packages.find]
include = ["driverupdater*"]
